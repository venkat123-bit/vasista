<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Vasista Food and Traders</title>
<link rel="icon" type="image/jpeg" href="logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<div class="auth-brand-header">
  <a href="index.html" class="nav-brand">
    <img src="logo.jpeg" alt="Vasista Food and Traders">
    <span class="nav-brand-text">Vasista<small>FOOD &amp; TRADERS</small></span>
  </a>
</div>

<section class="hero" style="padding:52px 28px 20px;">
  <div class="hero-inner" style="grid-template-columns:1fr; text-align:center;">
    <div class="hero-copy">
      <p class="hero-eyebrow">JOIN US</p>
      <h1>Create your account</h1>
      <p class="hero-sub" style="margin-left:auto; margin-right:auto;">Save your details once, order faster every time.</p>
    </div>
  </div>
</section>

<section class="section-pad" style="max-width:480px; margin:0 auto 80px;">
  <form id="signup-form" novalidate>
    <div class="delivery-grid" style="grid-template-columns:1fr;">
      <div class="d-field" id="field-name">
        <label for="su-name">Full Name*</label>
        <input type="text" id="su-name" autocomplete="name" placeholder="e.g. Priya Reddy">
        <span class="d-error">Please enter your name.</span>
      </div>
      <div class="d-field" id="field-email">
        <label for="su-email">Email*</label>
        <input type="email" id="su-email" autocomplete="email" placeholder="you@example.com">
        <span class="d-error">Please enter a valid email.</span>
      </div>
      <div class="d-field" id="field-phone">
        <label for="su-phone">Phone Number*</label>
        <input type="tel" id="su-phone" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit mobile number">
        <span class="d-error">Please enter a valid 10-digit number.</span>
      </div>
      <div class="d-field" id="field-password">
        <label for="su-password">Password*</label>
        <input type="password" id="su-password" autocomplete="new-password" placeholder="At least 6 characters">
        <span class="d-error">Password must be at least 6 characters.</span>
      </div>
      <div class="d-field" id="field-confirm">
        <label for="su-confirm">Confirm Password*</label>
        <input type="password" id="su-confirm" autocomplete="new-password" placeholder="Re-enter your password">
        <span class="d-error">Passwords do not match.</span>
      </div>
    </div>

    <p class="delivery-error-banner" id="signup-error-banner" style="display:none;"></p>

    <div class="cta-wrap" style="margin-top:24px;">
      <button type="submit" class="cta-btn" id="signup-btn" style="width:100%; justify-content:center; border:none; cursor:pointer;">
        <span id="signup-label">Create Account</span>
      </button>
      <p class="cta-note">Already have an account? <a href="login.html" style="color:var(--green-deep); font-weight:600;">Log in</a></p>
    </div>
  </form>
</section>

<script type="module">
  import {
    auth, db,
    onAuthStateChanged,
    createUserWithEmailAndPassword,
    updateProfile,
    doc, setDoc
  } from "./assets/firebase-config.js";

  // Already logged in? Skip straight to the site.
  onAuthStateChanged(auth, function (user) {
    if (user) window.location.replace("index.html");
  });

  const form = document.getElementById("signup-form");
  const errorBanner = document.getElementById("signup-error-banner");
  const btn = document.getElementById("signup-btn");
  const label = document.getElementById("signup-label");

  function showFieldError(id, show) {
    document.getElementById(id).classList.toggle("invalid", show);
  }

  function showBanner(msg) {
    errorBanner.textContent = msg;
    errorBanner.style.display = msg ? "block" : "none";
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    showBanner("");

    const name = document.getElementById("su-name").value.trim();
    const email = document.getElementById("su-email").value.trim();
    const phone = document.getElementById("su-phone").value.trim();
    const password = document.getElementById("su-password").value;
    const confirm = document.getElementById("su-confirm").value;

    let valid = true;
    showFieldError("field-name", !name); if (!name) valid = false;
    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    showFieldError("field-email", !emailOk); if (!emailOk) valid = false;
    const phoneOk = /^\d{10}$/.test(phone);
    showFieldError("field-phone", !phoneOk); if (!phoneOk) valid = false;
    const passOk = password.length >= 6;
    showFieldError("field-password", !passOk); if (!passOk) valid = false;
    const matchOk = password === confirm && confirm.length > 0;
    showFieldError("field-confirm", !matchOk); if (!matchOk) valid = false;

    if (!valid) return;

    label.textContent = "Creating account…";
    btn.disabled = true;

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      await updateProfile(cred.user, { displayName: name });
      try {
        await setDoc(doc(db, "users", cred.user.uid), {
          name: name, email: email, phone: phone, createdAt: new Date().toISOString()
        });
      } catch (dbErr) {
        // Firestore may not be enabled yet — account creation still succeeds.
        console.warn("Could not save profile to Firestore:", dbErr);
      }
      window.location.href = "index.html";
    } catch (err) {
      let msg = "Something went wrong. Please try again.";
      if (err.code === "auth/email-already-in-use") msg = "An account with this email already exists.";
      else if (err.code === "auth/invalid-email") msg = "Please enter a valid email address.";
      else if (err.code === "auth/weak-password") msg = "Password is too weak.";
      showBanner(msg);
      label.textContent = "Create Account";
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
